[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mercapy"
dynamic = ["version"]
description = "A synchronous, typed client for Mercadona's public storefront APIs"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Joel Taylor", email = "contact@joeltaylor.business" },
]
keywords = ["mercadona", "api", "client", "prices", "catalog"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-cov>=6",
  "ruff>=0.11",
  "twine>=6.1",
]

[project.urls]
Homepage = "https://github.com/jtayped/mercapy"
Issues = "https://github.com/jtayped/mercapy/issues"
Repository = "https://github.com/jtayped/mercapy"

[tool.hatch.version]
path = "src/mercapy/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mercapy"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "N", "PERF", "RUF", "S", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "scripts"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=src/mercapy --cov-branch --cov-report=term-missing --cov-fail-under=90"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/mercapy"]

[tool.coverage.report]
show_missing = true
skip_covered = true
